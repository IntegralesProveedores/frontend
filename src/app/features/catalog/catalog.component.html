	<!-- Grid -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
      <div class="col" *ngFor="let product of filtered(); trackBy: trackById">
        <app-product-card [product]="product" />
      </div>
    </div>
    
    <div *ngIf="loading()" class="py-5 text-center">
      <app-loading-spinner />
    </div>

    <div *ngIf="error()" class="alert alert-soft text-center py-4">
      {{ error() }}
    </div>
  </div>
</section>
