<section id="home">
  <app-breadcrumb
    [items]="[{ label: 'Productos', link: '/productos' }]"
    [clearLogo]="false"
  />
  <div class="hero-panel hero-panel--text">
    <h1>
      <img src="assets/images/brotalia.png" alt="Brotalia" />
      <span class="visually-hidden">Macetas biodegradables compostables</span>
    </h1>
	<p>Cultiv&aacute; desde la ra&iacute;z</p>
	
	
    <a
      routerLink="/productos"
      class="button"
      aria-label="Ver productos"
    >
      TIENDA &nbsp; <i aria-hidden="true" class="bi bi-shop"></i>
    </a>
	
	
	
	<a
	  href="https://listado.mercadolibre.com.ar/_CustId_461242361?item_id=MLA3800272782&category_id=MLA416946&seller_id=461242361&client=recoview-selleritems&recos_listing=true#origin=upp&component=sellerData&typeSeller=classic"
	  target="_blank"
	  rel="noopener noreferrer"
	  class="hero-ml-badge"
	  aria-label="Ver reputación en Mercado Libre"
	>
	  <div class="hero-ml-badge__logo">
	    <img src="/assets/icon/mercado-libre.png" alt="MERCADO LIBRE" />
	  </div>
	  <div class="hero-ml-badge__stats">
	    <div class="hero-ml-badge__bar">
	      <meter class="visually-hidden" min="0" max="5" value="5" optimum="5">5 de 5</meter>
	      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
	    </div>
	    <ul class="hero-ml-badge__items">
	      <li class="hero-ml-badge__item">
	        <span class="hero-ml-badge__value">+1000</span>
	        <span class="hero-ml-badge__label">Ventas</span>
	      </li>
	      <li class="hero-ml-badge__item">
	        <span class="hero-ml-badge__icon">
	          <i aria-hidden="true" class="bi bi-chat-left-text"></i>
	          <i aria-hidden="true" class="bi bi-check-circle-fill hero-ml-badge__check"></i>
	        </span>
	        <span class="hero-ml-badge__label">Buena atención</span>
	      </li>
	      <li class="hero-ml-badge__item">
	        <span class="hero-ml-badge__icon">
	          <i aria-hidden="true" class="bi bi-alarm"></i>
	          <i aria-hidden="true" class="bi bi-check-circle-fill hero-ml-badge__check"></i>
	        </span>
	        <span class="hero-ml-badge__label">Entrega a tiempo</span>
	      </li>
	    </ul>
	  </div>
	</a>
	
  </div>

  <div class="hero-panel hero-panel--image">
  
  
  </div>


</section>
