@if (!loading()) {
<section class="d-flex align-items-center min-vh-50 py-5">
  <div class="container-fluid">
    <div class="row justify-content-center text-center">
      @for (p of productos(); track p.id) {
      <div class="col-6 col-md-2 mb-4 producto-link">
        <a [routerLink]="['/productos', p.slug]">
          @if (p.images && p.images.length > 0) {
          <img [src]="p.images[0].url" 
               [alt]="p.name" 
               [title]="p.name" 
               class="rounded-circle mx-auto d-block img-preview" 
          />
          }
          <h2 class="mt-3 text-primary">{{ p.name }}</h2>
          @if (p.variants && p.variants.length > 0) {
          <h5 class="text-success">{{ p.variants[0].units_per_pack }}u.</h5>
          <p class="small text-secondary">
            <!--{{ getMeasurements(p) }}<br>-->
            @if (p.variants[0].dimensions.volume_cc) {
            <strong class="text-primary">
              {{ p.variants[0].dimensions.volume_cc }} cm<sup>3</sup>
            </strong>
            }
          </p>
          }

        </a>
      </div>
      }
    </div>
  </div>
</section>
}
