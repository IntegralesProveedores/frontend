<section class="bg-gradient d-flex align-items-center min-vh-50 py-5" *ngIf="!loading()">
  <div class="container-fluid">
    <div class="row justify-content-center text-center">
      <div class="col-6 col-md-2 mb-4 producto-link" *ngFor="let p of productos()">
        <a [routerLink]="['/productos', p.slug]">
          <img [src]="p.images[0].url" 
               [alt]="p.name" 
               [title]="p.name" 
               class="rounded-circle mx-auto d-block img-preview" 
          />
          <h2 class="mt-3">{{ p.name }}</h2>
          <h5 class="text-success" *ngIf="p.variants?.[0]">{{ p.variants[0].units_per_pack }}u.</h5>
          <p class="small" *ngIf="p.variants?.[0]">
            {{ getMeasurements(p) }}<br>
            <strong *ngIf="p.variants[0].dimensions?.volume_cc">
              {{ p.variants[0].dimensions.volume_cc }} cm<sup>3</sup>
            </strong>
          </p>
        </a>
      </div>
    </div>
  </div>
</section>
