<section>
  <div class="container">
    @if (notFound()) {
      <div class="order-detail-empty">
        <app-empty-state
          icon="bi-box2-open"
          title="Orden no encontrada"
          message="No pudimos encontrar la información de la orden solicitada. Verificá que el link sea correcto o contactanos para más ayuda."
          actionText="Volver al Catálogo"
          actionLink="/productos"
          secondaryActionText="Contactar Soporte"
          secondaryActionLink="/#contacto"
        />
      </div>
    } @else {
      <!-- Future Order Detail Content -->
      <h2>Detalle de la Orden</h2>
    }
  </div>
</section>
