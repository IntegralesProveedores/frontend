<div class="row">
  <div class="offset-md-1 col-lg-5">
    <app-skeleton width="50%" height="0.6rem" />

    <fieldset>
      <legend><app-skeleton width="35%" height="0.75rem" /></legend>
      <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
      <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
      <div class="row">
        <div class="col-4">
          <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
        </div>
        <div class="col-8">
          <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><app-skeleton width="45%" height="0.75rem" /></legend>
      <div>
        @for (i of [1, 2, 3]; track i) {
          <app-skeleton width="100%" height="35px" radius="var(--radius-sm)" />
        }
      </div>
      <div class="row">
        <div class="col-4">
          <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
        </div>
        <div class="col-8">
          <app-skeleton width="100%" height="30px" radius="var(--radius-sm)" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><app-skeleton width="35%" height="0.75rem" /></legend>
      <div>
        <app-skeleton width="100%" height="38px" radius="var(--radius-sm)" />
        <app-skeleton width="100%" height="38px" radius="var(--radius-sm)" />
      </div>
    </fieldset>
  </div>

  <div class="offset-md-1 col-lg-4">
    <aside>
      <section>
        @for (i of [1, 2]; track i) {
          <article>
            <app-skeleton width="40px" height="40px" radius="var(--border-radius-base)" />
            <div>
              <app-skeleton width="85%" height="0.8rem" />
              <app-skeleton width="40%" height="0.7rem" />
            </div>
          </article>
        }
        <div>
          <app-skeleton width="80px" height="1rem" />
          <app-skeleton width="100px" height="1.3rem" />
        </div>
      </section>

      <section>
        <div>
          <app-skeleton width="70px" height="1rem" />
          <app-skeleton width="90px" height="1.3rem" />
        </div>
      </section>

      <section>
        <div>
          <app-skeleton width="70px" height="1rem" />
          <app-skeleton width="60px" height="1.3rem" />
        </div>
      </section>

      <section>
        <div>
          <app-skeleton width="70px" height="1rem" />
          <div>
            <app-skeleton width="120px" height="1.5rem" />
            <app-skeleton width="90px" height="0.65rem" />
          </div>
        </div>
      </section>

      <app-skeleton width="100%" height="52px" radius="var(--border-radius-base)" />
    </aside>
  </div>
</div>
