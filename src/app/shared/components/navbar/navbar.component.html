<a
  class="logo-floating-block"
  routerLink="/"
  fragment="home"
  aria-label="Ir al inicio"
>
  <img
    src="/assets/images/brotalia-iso-00.png"
    class="logo-img"
    alt="Brotalia"
  />
</a>

<nav class="nav-bar nav-bar-vertical-right">
  <ul class="nav">
    <li class="nav-item">
      <a
        class="nav-link"
        routerLink="/"
        fragment="ventajas"
        aria-label="Ver ventajas"
      >
        <i aria-hidden="true" class="bi bi-info-circle"></i>
        <span class="nav-text">Ventajas</span>
      </a>
    </li>
    <li class="nav-item">
      <a
        class="nav-link"
        routerLink="/"
        fragment="servicios"
        aria-label="Informacion de envios"
      >
        <i aria-hidden="true" class="bi bi-truck"></i>
        <span class="nav-text">Envios</span>
      </a>
    </li>
    <li class="nav-item nav-item-home">
      <a
        class="nav-link"
        routerLink="/"
        fragment="home"
        aria-label="Ir al inicio"
      >
        <img src="/assets/images/brotalia-iso-00.png" alt="Brotalia" />
        <span class="nav-text">Home</span>
      </a>
    </li>
    <li class="nav-item">
      <a
        class="nav-link"
        routerLink="/"
        fragment="contacto"
        aria-label="Contacto"
      >
        <i aria-hidden="true" class="bi bi-whatsapp"></i>
        <span class="nav-text">Contacto</span>
      </a>
    </li>
    <li class="nav-item">
      @if (count() > 0) {
        <a routerLink="/carrito" class="nav-link" aria-label="Carrito">
          <app-cart-icon />
          <span class="nav-text">Carrito</span>
        </a>
      } @else {
        <a routerLink="/productos" class="nav-link" aria-label="Ir a la tienda">
          <i aria-hidden="true" class="bi bi-shop"></i>
          <span class="nav-text">Tienda</span>
        </a>
      }
    </li>
  </ul>
</nav>
