<div class="qty-selector">
  <button
    type="button"
    (click)="decrement.emit()"
    [disabled]="decrementDisabled"
    aria-label="Restar"
  >
    &minus;
  </button>
  <span>{{ quantity }}</span>
  <button
    type="button"
    (click)="increment.emit()"
    [disabled]="incrementDisabled"
    aria-label="Sumar"
  >
    +
  </button>
</div>
